[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
# Pin to resolve conflict: anchor-spl -> spl-token-2022 ->
# solana-zk-sdk requires =2.2.1, anchor-lang resolves to 2.3.3
solana-instruction = "=2.2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
