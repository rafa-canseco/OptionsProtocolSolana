[package]
name = "controller"
version = "0.1.0"
description = "Vault lifecycle: open, deposit, mint, settle, redeem"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "controller"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "whitelist/idl-build",
    "otoken_factory/idl-build",
    "oracle/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
whitelist = { path = "../whitelist", features = ["cpi"] }
otoken_factory = { package = "otoken-factory", path = "../otoken_factory", features = ["cpi"] }
oracle = { path = "../oracle", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
