[package]
name = "batch-settler"
version = "0.1.0"
description = "Trade execution (executeOrder) and expiry settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "batch_settler"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token"] }
jupiter-cpi = "4.0.3"
spl-token-lending = { version = "0.2.0", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
